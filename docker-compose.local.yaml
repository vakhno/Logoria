services:
  caddy-http:
    profiles: ["http"]
    image: caddy:2-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<EOF
        http://localhost:$${APP_PORT_NEXT} {
          reverse_proxy frontend-next:$${APP_PORT_NEXT}
        }

        http://localhost:$${APP_PORT_VITE} {
          reverse_proxy frontend-vite:$${APP_PORT_VITE}
        }

        http://localhost:$${API_PORT} {
        	reverse_proxy backend:$${API_PORT}
        }
        EOF
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      APP_PORT_NEXT: ${APP_PORT_NEXT}
      APP_PORT_VITE: ${APP_PORT_VITE}
      API_PORT: ${API_PORT}
    ports:
      - "${APP_PORT_NEXT}:${APP_PORT_NEXT}"
      - "${APP_PORT_VITE}:${APP_PORT_VITE}"
      - "${API_PORT}:${API_PORT}"
    depends_on:
      frontend-next:
        condition: service_started
      backend:
        condition: service_started

  caddy-https:
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat >/etc/caddy/Caddyfile <<EOF
        localhost:$${APP_PORT_NEXT} {
        	tls internal
          reverse_proxy frontend-next:$${APP_PORT_NEXT}
        }

        localhost:$${APP_PORT_VITE} {
          tls internal
          reverse_proxy frontend-vite:$${APP_PORT_VITE}
        }

        localhost:$${API_PORT} {
        	tls internal
        	reverse_proxy backend:$${API_PORT}
        }
        EOF
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      APP_PORT_NEXT: ${APP_PORT_NEXT}
      APP_PORT_VITE: ${APP_PORT_VITE}
      API_PORT: ${API_PORT}
    ports:
      - "${APP_PORT_NEXT}:${APP_PORT_NEXT}"
      - "${APP_PORT_VITE}:${APP_PORT_VITE}"
      - "${API_PORT}:${API_PORT}"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend-next:
        condition: service_started
      backend:
        condition: service_started

  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - ${PG_DATA_VOLUME}:${POSTGRES_DATA_PATH}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ${BACKEND_BUILD_CONTEXT}
      dockerfile: ${BACKEND_DOCKERFILE}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        BACKEND_EXPOSE_PORT: ${API_PORT}
    command: ${BACKEND_DEV_COMMAND}
    env_file:
      - ${ENV_FILE}
    environment:
      NODE_ENV: development
      ENV_FILE: ${ENV_FILE}
      API_PORT: ${API_PORT}
      APP_PORT_NEXT: ${APP_PORT_NEXT}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      VITE_APP_PUBLIC_URL: ${VITE_APP_PUBLIC_URL:-http://localhost:3003}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GOOGLE_AUTH_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID}
      GOOGLE_AUTH_CLIENT_SECRET: ${GOOGLE_AUTH_CLIENT_SECRET}
    volumes:
      - ./apps/backend:/app/apps/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/shared/auth/node_modules
      - /app/shared/queries/node_modules
    depends_on:
      db-push:
        condition: service_completed_successfully

  db-push:
    build:
      context: ${BACKEND_BUILD_CONTEXT}
      dockerfile: ${BACKEND_DOCKERFILE}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        BACKEND_EXPOSE_PORT: ${API_PORT}
    command: sh -lc "pnpm exec drizzle-kit push --config shared/db/drizzle.config.ts"
    env_file:
      - ${ENV_FILE}
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL}
    volumes:
      - ./shared:/app/shared
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend-next:
    build:
      context: ${FRONTEND_BUILD_CONTEXT}
      dockerfile: ${FRONTEND_DOCKERFILE}
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        FRONTEND_EXPOSE_PORT: ${APP_PORT_NEXT}
    command: ${FRONTEND_DEV_COMMAND}
    env_file:
      - ${ENV_FILE}
    environment:
      NODE_ENV: development
      ENV_FILE: ${ENV_FILE}
      INTERNAL_API_URL: http://backend:${API_PORT}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
    volumes:
      - ./apps/frontend-next:/app/apps/frontend-next
      - ./shared:/app/shared
      - /app/node_modules
      - /app/apps/frontend-next/node_modules
      - /app/shared/auth/node_modules
      - /app/shared/queries/node_modules
      - /app/apps/frontend-next/.next
    depends_on:
      backend:
        condition: service_started

  frontend-vite:
    build:
      context: .
      dockerfile: apps/frontend-vite/Dockerfile
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE}
    command: pnpm --filter frontend-vite run dev
    env_file:
      - ${ENV_FILE}
    environment:
      NODE_ENV: development
      VITE_API_PROXY_TARGET: http://backend:${API_PORT}
    volumes:
      - ./apps/frontend-vite:/app/apps/frontend-vite
      - ./shared:/app/shared
      - /app/node_modules
      - /app/apps/frontend-vite/node_modules
      - /app/shared/auth/node_modules
    depends_on:
      backend:
        condition: service_started

  storybook-dev:
    build:
      context: .
      dockerfile: apps/storybook/Dockerfile
      target: dev
      args:
        NODE_IMAGE: ${NODE_IMAGE}
    container_name: storybook-dev
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/storybook/package.json
    ports:
      - "6006:6006"
    volumes:
      - ./apps/storybook:/app/apps/storybook
      - ./shared:/app/shared
      - /app/node_modules
      - /app/apps/storybook/node_modules
      - /app/shared/auth/node_modules
      - /app/shared/queries/node_modules

volumes:
  pg-data:
    name: ${PG_DATA_VOLUME}
  caddy-data:
  caddy-config:
