packages:
  - "apps/*"
  - "shared/*"

# Preserve the existing dependency resolution and Docker bind-mount layout.
nodeLinker: hoisted

overrides:
  next: "16.3.4"
  react: "19.2.8"
  react-dom: "19.2.8"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  fsevents: true
  unrs-resolver: true
